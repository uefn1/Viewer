<style>

<body>
<div class="wrap">

<div class="card">
<div class="row">

<script>
const $=s=>document.querySelector(s);
const logEl=$('#log'), fileList=$('#fileList'), video=$('#video'), errBox=$('#errBox');
const statusEl=$('#status'), countEl=$('#count'), apiStat=$('#apiStat'), modeStat=$('#modeStat'), timeStat=$('#timeStat'), progEl=$('#progress');
let hls=null, currentUrls=[], currentM3u8='', tStart=0, selectedMode='auto';

function log(m){ const t=new Date().toLocaleTimeString(); logEl.textContent+=`[${t}] ${m}\n`; logEl.scrollTop=logEl.scrollHeight; console.log(m); }
function setStatus(s,cls=''){ statusEl.textContent=s; statusEl.className='pill '+cls; }
function setProgress(p){ progEl.style.width=Math.min(100,p)+'%'; }
function showErr(msg){ errBox.style.display='block'; errBox.textContent=msg; }
function hideErr(){ errBox.style.display='none'; errBox.textContent=''; }

function parseReleaseUrl(input){
  input=(input||'').trim();
  if(!input) return null;
  const direct=input.match(/(https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/releases\/download\/([^\/?#]+)\/[^?#]+\.ts)/i);
  if(direct){
    const owner=direct[2], repo=direct[3], tag=decodeURIComponent(direct[4]);
    return {owner,repo,tag, base:`https://github.com/${owner}/${repo}/releases/download/${encodeURIComponent(tag)}/`, directTs:direct[1]};
  }
  const m=input.match(/github\.com\/([^\/]+)\/([^\/]+)\/releases\/(?:tag|download)\/([^\/?#]+)/i);
  if(m){
    const owner=m[1], repo=m[2], tag=decodeURIComponent(m[3].split('/')[0]);
    return {owner,repo,tag, base:`https://github.com/${owner}/${repo}/releases/download/${encodeURIComponent(tag)}/`, directTs:null};
  }
  return null;
}

async function fetchReleaseAssets(owner,repo,tag,token){
  const apiUrl=`https://api.github.com/repos/${owner}/${repo}/releases/tags/${encodeURIComponent(tag)}`;
  apiStat.textContent='API:取得中';
  const headers={'Accept':'application/vnd.github+json'};
  if(token) headers['Authorization']=`Bearer ${token}`;
  const res=await fetch(apiUrl,{headers, cache:'no-store'});
  if(!res.ok){ const txt=await res.text(); throw new Error(`API ${res.status} ${txt.slice(0,200)}`); }
  const data=await res.json();
  apiStat.textContent=`API:OK ${data.assets?.length||0}`;
  return data.assets||[];
}

function buildM3u8(urls){
  const lines=['#EXTM3U','#EXT-X-VERSION:3','#EXT-X-TARGETDURATION:6','#EXT-X-MEDIA-SEQUENCE:0','#EXT-X-PLAYLIST-TYPE:VOD'];
  for(const u of urls){ lines.push('#EXTINF:6.0,'); lines.push(u); }
  lines.push('#EXT-X-ENDLIST'); return lines.join('\n');
}

function renderList(urls){
  fileList.innerHTML='';
  urls.forEach((u,i)=>{
    const li=document.createElement('li');
    const a=document.createElement('a'); a.href=u; a.target='_blank'; a.textContent=u.split('/').pop();
    const s=document.createElement('span'); s.textContent=`#${i}`; s.style.color='#8aa0b8';
    li.appendChild(a); li.appendChild(s); fileList.appendChild(li);
  });
  $('#listCount').textContent=`(${urls.length})`;
  countEl.textContent=`${urls.length} files`;
}

// 高速並列探索
async function probeFast(base, opts={}){
  const {prefix='out-', max=600, batchSize=20, maxConsecutiveFails=8, onBatch, onFirstBatch} = opts;
  log(`並列探索 batch=${batchSize} max=${max}`);
  let urlsMap=new Map();
  let consecutiveFails=0, totalChecked=0, earlyFired=false;
  for(let start=0; start<max; start+=batchSize){
    const batch=Array.from({length:batchSize},(_,k)=>start+k).filter(i=>i<max);
    const results=await Promise.all(batch.map(async i=>{
      const name=`${prefix}${String(i).padStart(3,'0')}.ts`;
      const url=base+name;
      try{
        // GitHubはHEADのCORSが微妙なので Range GETを優先
        let r=await fetch(url,{method:'GET', headers:{Range:'bytes=0-0'}, cache:'no-store', mode:'cors'});
        if(r.ok || r.status===206) return {i, ok:true, url};
        // それでもダメならHEAD
        r=await fetch(url,{method:'HEAD', cache:'no-store', mode:'cors'});
        if(r.ok) return {i, ok:true, url};
        return {i, ok:false, url, status:r.status};
      }catch(e){ return {i, ok:false, url, err:e.message}; }
    }));
    results.sort((a,b)=>a.i-b.i);
    for(const r of results){
      totalChecked++;
      if(r.ok){ urlsMap.set(r.i, r.url); consecutiveFails=0; }
      else{ if(urlsMap.size>0) consecutiveFails++; }
    }
    const sorted=[...urlsMap.entries()].sort((a,b)=>a[0]-b[0]).map(e=>e[1]);
    setProgress((totalChecked/max)*100);
    if(onBatch) onBatch(sorted, totalChecked);
    if(!earlyFired && sorted.length>=3){
      earlyFired=true;
      if(onFirstBatch) onFirstBatch(sorted);
    }
    if(urlsMap.size>0 && consecutiveFails>=maxConsecutiveFails){ log(`連続${consecutiveFails}失敗で終了 ${urlsMap.size}件`); break; }
    if(urlsMap.size===0 && start>60){ log('何も見つからず終了'); break; }
  }
  return [...urlsMap.entries()].sort((a,b)=>a[0]-b[0]).map(e=>e[1]);
}

// 再生エンジン
async function playHls(urls){
  log(`[HLS] ${urls.length}件で試行`);
  modeStat.textContent='mode:hls';
  currentM3u8=buildM3u8(urls);
  renderList(urls);
  if(hls){ try{hls.destroy();}catch{} hls=null; }
  const blob=new Blob([currentM3u8],{type:'application/vnd.apple.mpegurl'});
  const blobUrl=URL.createObjectURL(blob);
  return new Promise((resolve,reject)=>{
    if(Hls.isSupported()){
      hls=new Hls({
        enableWorker:true,
        maxBufferLength:60,
        maxMaxBufferLength:120,
        maxBufferSize:60*1000*1000,
        startLevel:-1,
        xhrSetup:(xhr,url)=>{
          // GitHubリダイレクト対応: withCredentials false
          xhr.withCredentials=false;
        }
      });
      hls.loadSource(blobUrl);
      hls.attachMedia(video);
      let resolved=false;
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
        log('[HLS] MANIFEST_PARSED');
        video.play().then(()=>{ if(!resolved){ resolved=true; resolve(true); } }).catch(e=>{ log('[HLS] play()失敗 '+e); });
        setStatus('再生中 HLS','ok');
      });
      hls.on(Hls.Events.ERROR,(ev,data)=>{
        log(`[HLS] ERROR ${data.type}/${data.details} fatal=${data.fatal} ${data.reason||''}`);
        if(data.fatal){
          if(!resolved){ resolved=true; reject(new Error('HLS fatal '+data.details)); }
        }
      });
      setTimeout(()=>{ if(!resolved){ resolved=true; reject(new Error('HLS timeout')); } }, 15000);
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=blobUrl;
      video.addEventListener('loadedmetadata', ()=>{ video.play().catch(()=>{}); resolve(true); }, {once:true});
      video.addEventListener('error', ()=>reject(new Error('Native HLS error')), {once:true});
      setStatus('Safari Native HLS','ok');
    } else {
      reject(new Error('HLS not supported'));
    }
  });
}

async function playBlobConcat(urls){
  log(`[BLOB] ${urls.length}件を並列DLして連結`);
  modeStat.textContent='mode:blob';
  setStatus('Blob DL中...');
  const concurrency=6;
  const bufs=new Array(urls.length);
  let done=0;
  async function pool(){
    let idx=0;
    async function next(){
      const cur=idx++;
      if(cur>=urls.length) return;
      const u=urls[cur];
      try{
        const r=await fetch(u,{mode:'cors', cache:'no-store'});
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        const ab=await r.arrayBuffer();
        // 0x47 TS sync byte check
        const view=new Uint8Array(ab);
        if(view[0]!==0x47) log(`[BLOB] #${cur} 先頭が0x47でない (${view[0]}) - TSではない可能性`);
        bufs[cur]=view;
        done++; setProgress((done/urls.length)*100);
        log(`[BLOB] DL ${cur+1}/${urls.length} ${(ab.byteLength/1024/1024).toFixed(2)}MB`);
      }catch(e){ log(`[BLOB] DL失敗 #${cur} ${e.message}`); }
      return next();
    }
    const workers=Array.from({length:Math.min(concurrency,urls.length)},()=>next());
    await Promise.all(workers);
  }
  await pool();
  const valid=bufs.filter(Boolean);
  if(valid.length===0) throw new Error('Blob DL: 全て失敗');
  const total=valid.reduce((s,b)=>s+b.length,0);
  const merged=new Uint8Array(total);
  let off=0; for(const b of valid){ merged.set(b,off); off+=b.length; }
  log(`[BLOB] 連結完了 ${ (total/1024/1024).toFixed(1)}MB -> video/mp2t`);
  const blob=new Blob([merged],{type:'video/mp2t'});
  const url=URL.createObjectURL(blob);
  video.src=url;
  window._lastBlobUrl=url;
  window._lastBlob=blob;
  try{
    await video.play();
    setStatus(`再生 Blob ${(total/1024/1024).toFixed(1)}MB`,'ok');
    return true;
  }catch(e){
    log(`[BLOB] play()失敗 ${e.message} - MSEへフォールバック推奨`);
    // try with video/mp2t may not be supported, try video/mp4?
    throw e;
  }
}

async function playMSE(urls){
  log(`[MSE mux.js] ${urls.length}件を順次Transmux`);
  modeStat.textContent='mode:mse';
  if(!window.muxjs){ throw new Error('mux.js not loaded'); }
  // Reset video
  if(hls){ try{hls.destroy();}catch{} hls=null; }
  video.pause(); video.removeAttribute('src'); video.load();

  return new Promise(async (resolve, reject)=>{
    const ms=new MediaSource();
    const msUrl=URL.createObjectURL(ms);
    video.src=msUrl;
    ms.addEventListener('sourceopen', async ()=>{
      const mime='video/mp4; codecs="avc1.42E01E, mp4a.40.2"';
      const mime2='video/mp4; codecs="avc1.64001E, mp4a.40.2"';
      let useMime=mime;
      if(!MediaSource.isTypeSupported(mime)){
        if(MediaSource.isTypeSupported(mime2)) useMime=mime2;
        else { log(`[MSE] MIME unsupported ${mime}`); reject(new Error('MSE mime unsupported')); return; }
      }
      log(`[MSE] using ${useMime}`);
      const sb=ms.addSourceBuffer(useMime);
      const transmuxer=new muxjs.mp4.Transmuxer({keepOriginalTimestamps:true});
      let queue=[];
      let hasInit=false;

      transmuxer.on('data', (seg)=>{
        if(seg.initSegment){
          queue.push(seg.initSegment);
          hasInit=true;
        }
        if(seg.data){
          queue.push(seg.data);
        }
      });
      transmuxer.on('done', ()=>{});

      sb.addEventListener('updateend', ()=>{
        if(queue.length>0 && !sb.updating){
          try{ sb.appendBuffer(queue.shift()); }catch(e){ log('[MSE] appendBuffer error '+e); }
        } else if(queue.length===0 && !sb.updating){
          // check if finished
        }
      });
      sb.addEventListener('error', (e)=>{ log('[MSE] SourceBuffer error '+e); });

      try{
        for(let i=0;i<urls.length;i++){
          setStatus(`MSE DL ${i+1}/${urls.length}`);
          setProgress((i/urls.length)*100);
          const r=await fetch(urls[i],{mode:'cors', cache:'no-store'});
          if(!r.ok){ log(`[MSE] fetch fail ${urls[i]} ${r.status}`); continue; }
          const ab=await r.arrayBuffer();
          const data=new Uint8Array(ab);
          // push to transmuxer
          transmuxer.push(data);
          transmuxer.flush();
          // wait for data to be queued and appended
          // append if possible
          while(queue.length>0 && !sb.updating){
            sb.appendBuffer(queue.shift());
            await new Promise(r=>setTimeout(r,10));
          }
          // give time for append
          await new Promise(r=>setTimeout(r,30));
          if(i===0){
            // try play early
            video.play().catch(()=>{});
          }
        }
        // drain queue
        let attempts=0;
        while((queue.length>0 || sb.updating) && attempts<100){
          if(queue.length>0 && !sb.updating){
            sb.appendBuffer(queue.shift());
          }
          await new Promise(r=>setTimeout(r,100));
          attempts++;
        }
        if(ms.readyState==='open'){
          ms.endOfStream();
        }
        setStatus('再生中 MSE','ok');
        setProgress(100);
        resolve(true);
      }catch(e){
        log('[MSE] exception '+e.message);
        reject(e);
      }
    });
    ms.addEventListener('sourceopen', ()=>{}, {once:true});
    ms.addEventListener('error', ()=>reject(new Error('MediaSource error')));
  });
}

async function playDirect(urls){
  log(`[DIRECT] 最初のTSをvideo.srcに直接セット (CORS不要)`);
  modeStat.textContent='mode:direct';
  if(urls.length===0) throw new Error('no urls');
  video.src=urls[0];
  await video.play();
  setStatus('再生 Direct (1件のみ)','ok');
  // 残りはMediaSourceで連結したいが簡易的にplaylistとして扱うために次のファイル終了時にsrc切替
  let idx=0;
  video.addEventListener('ended', ()=>{
    idx++;
    if(idx<urls.length){
      log(`[DIRECT] next ${idx}`);
      video.src=urls[idx];
      video.play().catch(()=>{});
    }
  });
  return true;
}

async function autoPlay(urls){
  const tryOrder = selectedMode==='auto' ? ['hls','mse','blob','direct'] : [selectedMode];
  let lastErr=null;
  for(const m of tryOrder){
    try{
      hideErr();
      if(m==='hls') await playHls(urls);
      else if(m==='mse') await playMSE(urls);
      else if(m==='blob') await playBlobConcat(urls);
      else if(m==='direct') await playDirect(urls);
      return; // success
    }catch(e){
      log(`[${m}] 失敗: ${e.message}`);
      lastErr=e;
      // continue to next
    }
  }
  setStatus('全再生方式失敗','err');
  showErr(`再生失敗:\n${lastErr?.message||'unknown'}\n\n考えられる原因:\n1. GitHubの .ts が TS形式ではない / コーデックが H264/AACではない\n2. CORSブロック (privateリポジトリ?)\n3. ファイルが壊れている\n\nログを確認して最初の1件を直接DLして VLC で再生できるか試してください。\n直リンク: ${urls[0]||''}`);
}

async function handleLoad(isProbeOnly=false){
  const input=$('#urlInput').value.trim();
  const token=$('#tokenInput').value.trim();
  if(!input){ alert('URL入力'); return; }
  const parsed=parseReleaseUrl(input);
  if(!parsed){ log('URL解析失敗'); return; }
  tStart=performance.now();
  log(`解析 owner=${parsed.owner} repo=${parsed.repo} tag=${parsed.tag}`);
  setStatus('取得中...'); logEl.textContent=''; fileList.innerHTML=''; setProgress(5); hideErr();

  let urls=[];
  if(parsed.directTs){
    log('直接TS→周辺探索');
    urls=await probeFast(parsed.base, {onBatch:(u)=>renderList(u), onFirstBatch:(u)=>{ if(!isProbeOnly) autoPlay(u); }});
    if(urls.length===0) urls=[parsed.directTs];
  } else if(!isProbeOnly){
    try{
      const assets=await fetchReleaseAssets(parsed.owner, parsed.repo, parsed.tag, token);
      const tsAssets=assets.filter(a=>a.name.toLowerCase().endsWith('.ts')).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
      if(tsAssets.length>0){
        urls=tsAssets.map(a=>a.browser_download_url);
        log(`APIで ${urls.length}件`);
        setProgress(50);
      } else {
        log('APIに.ts無し→並列探索');
        urls=await probeFast(parsed.base, {onBatch:(u)=>renderList(u), onFirstBatch:(u)=>autoPlay(u)});
      }
    }catch(e){
      log(`API失敗 ${e.message} →並列探索`);
      urls=await probeFast(parsed.base, {onBatch:(u)=>renderList(u), onFirstBatch:(u)=>autoPlay(u)});
    }
  } else {
    urls=await probeFast(parsed.base, {onBatch:(u)=>renderList(u)});
  }

  if(urls.length===0){ setStatus('見つからず','err'); return; }
  renderList(urls);
  setProgress(70);
  if(!isProbeOnly){
    // if early play already started, ensure final full list is used after full probe
    const finalUrls=urls;
    if(currentUrls.length>0 && finalUrls.length>currentUrls.length){
      log(`全${finalUrls.length}件で最終プレイリスト更新`);
      // wait a bit then replay full
      setTimeout(()=>autoPlay(finalUrls), 500);
    } else if(currentUrls.length===0){
      await autoPlay(finalUrls);
    }
  }
  const elapsed=((performance.now()-tStart)/1000).toFixed(2);
  timeStat.textContent=`${elapsed}s`;
  setProgress(100);
}

// UI bindings
$('#loadBtn').addEventListener('click',()=>handleLoad(false));
$('#probeBtn').addEventListener('click',()=>handleLoad(true));
$('#copyM3u8').addEventListener('click', async()=>{
  if(!currentM3u8){ alert('m3u8無し'); return; }
  await navigator.clipboard.writeText(currentM3u8); log('m3u8コピー');
});
$('#dlBtn').addEventListener('click', ()=>{
  if(!window._lastBlobUrl){ alert('先にBlob再生してください'); return; }
  const a=document.createElement('a'); a.href=window._lastBlobUrl; a.download=`concat-${Date.now()}.ts`; a.click();
});
document.querySelectorAll('.mode button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.mode button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    selectedMode=b.dataset.mode;
    modeStat.textContent='mode:'+selectedMode;
  });
});
$('#rate').addEventListener('input', e=>{
  video.playbackRate=parseFloat(e.target.value);
  $('#rateLabel').textContent=e.target.value+'x';
});
$('#pipBtn').addEventListener('click', async()=>{
  try{ if(document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); }catch(e){ log('PiP '+e.message); }
});
video.addEventListener('loadedmetadata', ()=>{
  $('#videoInfo').textContent=`${video.videoWidth}x${video.videoHeight} ${(video.duration||0).toFixed(1)}s`;
});
video.addEventListener('error', ()=>{
  const err=video.error;
  log(`[VIDEO] error code=${err?.code} msg=${err?.message||''}`);
  showErr(`videoタグエラー code=${err?.code}\nブラウザがTSコーデックに対応していない可能性。MSEモードを試してください。`);
});

// auto load ?url=
window.addEventListener('DOMContentLoaded', ()=>{
  const sp=new URLSearchParams(location.search);
  const u=sp.get('url')||sp.get('src');
  if(u){ $('#urlInput').value=u; handleLoad(false); }
});
</script>
